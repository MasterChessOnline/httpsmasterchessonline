  <body>
    <div id="root"></div>
    <!-- INSTANT PAINT FOR PAID AD LANDINGS
         Ad traffic arrives on slow mobile connections and bounces in about
         three seconds. Before that, React has not booted and the screen is
         black, so the click is wasted. This paints a real chessboard plus the
         ad's promise in the first frame, with no JS framework and no requests.
         React replaces the whole #root subtree when it mounts. -->
    <script>
      (function () {
        var p = location.pathname;
        var isAd = p === "/ig" || p === "/start" || p.indexOf("/ads/") === 0;

        // SOCIAL ENTRY, DECIDED BEFORE REACT BOOTS
        // Most paid clicks land on "/" (Instagram bio links and ad links get
        // shortened by hand), and the React-side router only redirected after
        // the whole home page had loaded — long after a 3-second visit ended.
        // Detect the social click here, in the first frame, and rewrite the URL
        // to the ad funnel with no extra network round trip.
        if (!isAd && p === "/") {
          try {
            var qs = new URLSearchParams(location.search);
            var raw = (qs.get("utm_source") || qs.get("ref") || "").toLowerCase();
            var ref = "";
            try { ref = document.referrer ? new URL(document.referrer).hostname : ""; } catch (e) {}
            var ua = navigator.userAgent || "";
            var social = "";
            if (/instagram|^ig$/.test(raw) || /instagram/i.test(ref) || /Instagram/i.test(ua)) social = "instagram";
            else if (/tiktok|^tt$/.test(raw) || /tiktok/i.test(ref)) social = "tiktok";
            else if (/facebook|meta|^fb$/.test(raw) || /facebook/i.test(ref) || /FBAN|FBAV|FB_IAB/i.test(ua)) social = "facebook";

            var signedIn = false;
            for (var i = 0; i < localStorage.length; i++) {
              var k = localStorage.key(i);
              if (k && k.indexOf("sb-") === 0 && k.indexOf("-auth-token") > 0) signedIn = true;
            }

            if (social && !signedIn && sessionStorage.getItem("mc_social_routed") !== "1") {
              sessionStorage.setItem("mc_social_routed", "1");
              if (!qs.get("utm_source")) qs.set("utm_source", social);
              qs.set("detected", "inline");
              history.replaceState(null, "", "/ig?" + qs.toString());
              isAd = true;
            }
          } catch (e) {
            /* private mode — keep the normal home page */
          }
        }

        if (!isAd) return;
        var light = "#e9d7ae", dark = "#8a6a3c", sq = "";
        for (var r = 0; r < 8; r++) {
          for (var c = 0; c < 8; c++) {
            sq += '<div style="background:' + ((r + c) % 2 ? dark : light) + '"></div>';
          }
        }
        document.getElementById("root").innerHTML =
          '<div style="min-height:100dvh;background:#0b0b0d;color:#f4f1e8;font-family:system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;padding:14px 12px">' +
          '<div style="font-weight:800;letter-spacing:.02em;font-size:14px;color:#e2b857">MasterChess</div>' +
          '<div style="font-weight:800;font-size:18px;margin-top:10px">Free chess &middot; your move</div>' +
          '<div style="font-size:11px;opacity:.65;margin-top:2px">Tap a piece to start. No account needed.</div>' +
          '<div style="display:grid;grid-template-columns:repeat(8,1fr);width:min(92vw,420px);aspect-ratio:1;margin-top:14px;border-radius:8px;overflow:hidden;box-shadow:0 0 0 1px rgba(226,184,87,.35)">' +
          sq + "</div>" +
          '<div style="font-size:11px;opacity:.5;margin-top:14px">Loading the board&hellip;</div>' +
          "</div>";
      })();
    </script>
